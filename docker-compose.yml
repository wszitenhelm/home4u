services:
  mysql:
    image: mysql:8.4
    container_name: home4u-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: home4u
      MYSQL_USER: home4u
      MYSQL_PASSWORD: home4u
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
